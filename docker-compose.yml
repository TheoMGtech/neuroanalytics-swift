services:
  database:
    image: postgres:16
    container_name: neuroanalytics_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: neuro
      POSTGRES_PASSWORD: neuro
      POSTGRES_DB: neuroanalytics
    ports:
      - "5432:5432"
    volumes:
      - neuroanalytics_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: neuroanalytics_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://neuro:neuro@database:5432/neuroanalytics
      - DIRECT_URL=postgresql://neuro:neuro@database:5432/neuroanalytics
    depends_on:
      - database
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: neuroanalytics_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  neuroanalytics_postgres_data:
